name: Build Page Calibration Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'dwdgg/readest'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_DISABLE_UPDATER: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: pdf-calibration-windows
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare PDF assets
        run: pnpm --filter @readest/readest-app setup-vendors
      - name: Check types and lint
        run: pnpm lint
      - name: Test page calibration
        run: pnpm --filter @readest/readest-app test --run src/__tests__/components/page-jump-input.test.tsx src/__tests__/components/settings/PDFPageNumbering.test.tsx src/__tests__/components/ProgressBar.test.tsx --maxWorkers=4
      - name: Configure independent test build
        run: node apps/readest-app/scripts/prepare-pdf-calibration-build.mjs
      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/readest-app
          tauriScript: pnpm tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: page-calibration-v__VERSION__
          releaseName: Readest Page Calibration __VERSION__ (Windows x64)
          releaseDraft: false
          prerelease: true
          uploadUpdaterJson: false
          releaseBody: |
            非官方通用页码校准测试版，基于 Readest 0.12.12。

            下载 Assets 中的 setup.exe 安装程序。支持负页码、零页码、校准后跳页、本地保存和重置。
            在书籍正文第一页打开“设置 → 布局”，选择页码显示，将当前页码设为 1 并应用。

            与官方版使用不同的应用标识和安装名称，默认书库独立；请重新导入书籍。
            自动更新关闭。本安装包未做 Windows 代码签名，系统可能显示发布者未知提示。
            校准只改变页码显示和跳转，不修改书籍文件；目录、缩略图及批注页码暂未校准。
            支持阅读器各格式；文字书籍按阅读器分页校准，排版变化影响页码时需要重新校准。
            完整对应源码见本发布标签；保留原项目 AGPL-3.0-or-later 许可证及版权声明。
